[llm]
# Fill in the Chat Completions base URL, excluding /chat/completions.
base_url = https://your-provider.example/v1
api_key = YOUR_API_KEY
model = YOUR_MODEL
# true: print each incoming chunk; false: print the complete response.
stream = true

[search]
# Optional. Keep your real key only in the ignored config.ini.
baidu_qianfan_api_key = YOUR_BAIDU_QIANFAN_API_KEY
